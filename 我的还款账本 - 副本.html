<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的还款账本</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px}h1{margin:0 0 6px}.sub{color:#64748b;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.panel,table{background:#fff;border-radius:14px;box-shadow:0 3px 16px #17203312}.card{padding:17px}.label{color:#64748b;font-size:14px}.value{font-size:24px;font-weight:700;margin-top:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}.month{font-weight:700;font-size:18px;background:#fff;padding:10px 14px;border-radius:9px}button{border:0;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.dark{background:#172033;color:#fff}.danger{background:#fee2e2;color:#991b1b}.muted{background:#e2e8f0;color:#334155}button:disabled{opacity:.45;cursor:not-allowed}table{width:100%;border-collapse:collapse;overflow:hidden}th,td{padding:12px 9px;border-bottom:1px solid #edf0f4;text-align:center}th{background:#f8fafc;font-size:14px}input{width:105px;padding:8px;border:1px solid #cbd5e1;border-radius:7px;text-align:right}.done{color:#16a34a;font-weight:700}.pending{color:#d97706;font-weight:700}.panel{padding:15px;margin-top:20px}.panel h2{font-size:18px;margin:0 0 12px}.form{display:flex;gap:9px;flex-wrap:wrap}.form input{width:auto;text-align:left}.history-item{padding:10px 0;border-bottom:1px solid #edf0f4}.history-item:last-child{border:0}.tip{color:#92400e;background:#fff7ed;padding:12px;border-radius:9px;margin-top:18px;font-size:14px}.small{font-size:12px;color:#64748b}@media(max-width:700px){.wrap{padding:15px 10px}.cards{grid-template-columns:1fr}.table-scroll{overflow-x:auto}table{min-width:760px}.toolbar{gap:7px}.form input{width:100%}.form button{width:100%}}
</style>
</head>
<body><main class="wrap">
<h1>💰 我的还款账本</h1><div class="sub">数据保存在当前浏览器，可撤销还款、添加欠款，并通过导出文件在手机和电脑之间同步。</div>
<section class="cards"><div class="card"><div class="label">当前总待还</div><div class="value" id="total">¥0.00</div></div><div class="card"><div class="label">本月计划还款</div><div class="value" id="monthly">¥0.00</div></div><div class="card"><div class="label">本月已还</div><div class="value" id="paid">¥0.00</div></div></section>
<div class="toolbar"><div class="month" id="month"></div><button class="muted" id="previousButton" onclick="previousMonth()">← 返回上个月</button><button class="primary" onclick="nextMonth()">进入下个月 →</button><button class="muted" onclick="exportData()">导出同步文件</button><button class="muted" onclick="setInitialFromCurrent()">设为初始账本</button><button class="muted" onclick="document.getElementById('importFile').click()">导入同步文件</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button class="danger" onclick="resetData()">恢复初始账本</button></div>
<div class="table-scroll"><table><thead><tr><th>分类</th><th>待还金额</th><th>本月计划</th><th>实际还款</th><th>剩余期数</th><th>状态</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div>
<section class="panel"><h2>新增欠款</h2><div class="form"><input id="newName" placeholder="名称，如朋友借款"><input id="newBalance" type="number" min="0" step="0.01" placeholder="欠款总额"><input id="newPlan" type="number" min="0" step="0.01" placeholder="每月计划"><input id="newPeriods" type="number" min="1" step="1" placeholder="期数（可选）"><button class="primary" onclick="addDebt()">新增欠款</button></div></section>
<div class="tip"><b>使用提示：</b>点击“本月已还”会记录一笔还款；如果点错，可立即点击该行的“撤销本次还款”，金额和期数都会恢复。手机与电脑之间请在一台设备导出 JSON，再在另一台设备导入。</div>
<section class="panel"><h2>还款记录</h2><div id="history"></div></section>
</main>
<script>
const initial=[{name:"美团",balance:6680.86,plan:2233.96,periods:3,fixed:true},{name:"京东",balance:1582.75,plan:333.91,periods:5,fixed:true},{name:"信用卡",balance:9696.49,plan:342.91,periods:null,fixed:false},{name:"e招贷",balance:6391.71,plan:491.67,periods:13,fixed:true},{name:"花呗",balance:10076.67,plan:530,periods:null,fixed:false},{name:"黄翔",balance:10224,plan:1204,periods:null,fixed:false}];
const fileKey="debtBook:"+location.pathname.toLowerCase(),initialKey=fileKey+":initial";function getInitial(){return JSON.parse(localStorage.getItem(initialKey)||"null")||initial}const fresh=()=>({month:"2026-08",debts:getInitial().map(d=>({...d,paid:false,paidAmount:0,undo:null})),paidThisMonth:0,history:[],future:[]});let state=JSON.parse(localStorage.getItem(fileKey)||"null");if(!state&&location.pathname.includes("我的还款账本")){state=JSON.parse(localStorage.getItem("debtBook")||"null");if(state)localStorage.setItem(fileKey,JSON.stringify(state))}state=state||fresh();state.future=state.future||[];
function money(n){return "¥"+Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2})}function save(){localStorage.setItem(fileKey,JSON.stringify(state))}
function render(){document.getElementById("month").textContent=state.month+" 还款";let total=state.debts.reduce((s,d)=>s+Math.max(0,d.balance),0),monthly=state.debts.reduce((s,d)=>s+Math.min(d.balance,d.plan),0);totalEl.textContent=money(total);monthlyEl.textContent=money(monthly);paidEl.textContent=money(state.paidThisMonth);tbody.innerHTML="";state.debts.forEach((d,i)=>{let plan=Math.min(d.balance,d.plan),done=d.balance<=.005||d.paid;let tr=document.createElement("tr");tr.innerHTML=`<td><b>${esc(d.name)}</b></td><td>${money(d.balance)}</td><td>${money(plan)}</td><td><input id="pay-${i}" type="number" min="0" step="0.01" value="${d.paidAmount||plan}" ${done?'disabled':''}></td><td>${d.periods==null?"—":d.periods+"期"}</td><td class="${done?'done':'pending'}">${d.balance<=.005?'已还清':d.paid?'本月已还':'待还'}</td><td>${d.paid?`<button class="danger" onclick="undoPay(${i})">撤销本次还款</button>`:`<button class="dark" onclick="pay(${i})" ${d.balance<=.005?'disabled':''}>本月已还</button>`} <button class="muted" onclick="editDebt(${i})">编辑</button> <button class="danger" onclick="deleteDebt(${i})">删除</button></td>`;tbody.appendChild(tr)});renderHistory()}
function pay(i){let d=state.debts[i],amount=Math.max(0,Math.min(Number(document.getElementById("pay-"+i).value)||0,d.balance));if(!amount)return alert("请输入实际还款金额");d.undo={balance:d.balance,periods:d.periods,amount};d.balance=+(d.balance-amount).toFixed(2);d.paidAmount=amount;d.paid=true;if(d.fixed&&d.periods>0){d.periods--;if(d.periods===0)d.balance=0}state.paidThisMonth=+(state.paidThisMonth+amount).toFixed(2);save();render()}
function undoPay(i){let d=state.debts[i];if(!d.undo)return;d.balance=d.undo.balance;d.periods=d.undo.periods;state.paidThisMonth=+(state.paidThisMonth-d.undo.amount).toFixed(2);d.paid=false;d.paidAmount=0;d.undo=null;save();render()}
function deleteDebt(i){let d=state.debts[i];if(!confirm(`确定删除“${d.name}”吗？删除后不可恢复。`))return;if(d.paid)state.paidThisMonth=+(state.paidThisMonth-(d.paidAmount||0)).toFixed(2);state.debts.splice(i,1);save();render()}
function setInitialFromCurrent(){if(!state.debts.length)return alert("当前没有欠款项目");if(!confirm("将当前欠款列表保存为新的初始账本？以后点击‘恢复初始账本’会使用这份数据。"))return;localStorage.setItem(initialKey,JSON.stringify(state.debts.map(d=>({name:d.name,balance:d.balance,plan:d.plan,periods:d.periods,fixed:d.periods!==null}))));alert("初始账本已更新")}
function editDebt(i){let d=state.debts[i],name=prompt("名称：",d.name);if(name===null)return;name=name.trim();let balance=Number(prompt("当前待还金额：",d.balance));let plan=Number(prompt("每月计划还款：",d.plan));let rawPeriods=prompt("剩余期数（留空表示不限期）：",d.periods==null?"":d.periods);let periods=rawPeriods===""?null:Number(rawPeriods);if(!name||!Number.isFinite(balance)||balance<0||!Number.isFinite(plan)||plan<0||(periods!==null&&(!Number.isInteger(periods)||periods<0))){alert("输入无效，请检查编辑内容");return}d.name=name;d.balance=+balance.toFixed(2);d.plan=+plan.toFixed(2);d.periods=periods;d.fixed=periods!==null;if(d.balance<=.005)d.paid=true;else if(!d.paid)d.paid=false;save();render()}
function addDebt(){let name=newName.value.trim(),balance=Number(newBalance.value),plan=Number(newPlan.value),periods=newPeriods.value?Number(newPeriods.value):null;if(!name||balance<=0||plan<0)return alert("请填写名称、有效欠款金额和每月计划");state.debts.push({name,balance:+balance.toFixed(2),plan:+plan.toFixed(2),periods,fixed:periods!==null,paid:false,paidAmount:0,undo:null});[newName,newBalance,newPlan,newPeriods].forEach(x=>x.value="");save();render()}
function nextMonth(){if(state.future.length){let forward=state.future.shift();state.history.unshift({month:state.month,paid:state.paidThisMonth,total:state.debts.reduce((s,d)=>s+Math.max(0,d.balance),0),debts:JSON.parse(JSON.stringify(state.debts))});state.month=forward.month;state.debts=forward.debts;state.paidThisMonth=forward.paid;save();render();updatePreviousButton();return}if(state.debts.some(d=>d.balance>.005&&!d.paid)&&!confirm("还有项目未标记本月已还，确定进入下个月吗？"))return;state.history.unshift({month:state.month,paid:state.paidThisMonth,total:state.debts.reduce((s,d)=>s+Math.max(0,d.balance),0),debts:JSON.parse(JSON.stringify(state.debts))});let [y,m]=state.month.split("-").map(Number);if(++m===13){m=1;y++}state.month=`${y}-${String(m).padStart(2,"0")}`;state.paidThisMonth=0;state.debts.forEach(d=>{d.paid=false;d.paidAmount=0;d.undo=null});save();render();updatePreviousButton()}
function previousMonth(){let last=state.history[0];if(!last||!last.debts)return;if(!confirm("返回上个月？当前月份数据会保留，之后可再次进入下个月。"))return;state.future.unshift({month:state.month,paid:state.paidThisMonth,debts:JSON.parse(JSON.stringify(state.debts))});state.history.shift();state.month=last.month;state.debts=last.debts;state.paidThisMonth=last.paid;save();render();updatePreviousButton()}
function updatePreviousButton(){let b=document.getElementById("previousButton");b.className=state.history.some(x=>x.debts)?"primary":"muted"}
function renderHistory(){history.innerHTML=state.history.length?state.history.map(x=>`<div class="history-item"><b>${x.month}</b>　已还 ${money(x.paid)}　|　月末待还 ${money(x.total)}</div>`).join(""):"<span class='small'>暂无历史记录</span>"}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="还款账本-"+state.month+".json";a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.month||!Array.isArray(x.debts))throw Error();state=x;save();render();alert("导入成功")}catch{alert("文件格式不正确")}};r.readAsText(f);e.target.value=""}function resetData(){if(confirm("确定恢复初始账本吗？当前数据会被覆盖。")){state=fresh();save();render()}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const totalEl=document.getElementById("total"),monthlyEl=document.getElementById("monthly"),paidEl=document.getElementById("paid"),tbody=document.getElementById("tbody"),history=document.getElementById("history"),newName=document.getElementById("newName"),newBalance=document.getElementById("newBalance"),newPlan=document.getElementById("newPlan"),newPeriods=document.getElementById("newPeriods");render();
</script></body></html>
